version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm — the frontend and build toolchain
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # TipTap packages share a version and are meant to move in lockstep --
      # a PR bumping one @tiptap/* package on its own can break the editor at
      # runtime even though it installs cleanly. Always update them together.
      #
      # update-types is required here, not optional: without it this group has
      # no restriction at all and will happily bundle a major version bump into
      # one mergeable-looking PR. That is exactly how a 2.x->3.x Tiptap jump
      # once got through as a single green-looking PR -- majors need to arrive
      # separately so they get read, not merged on autopilot.
      tiptap:
        patterns:
          - "@tiptap/*"
        update-types:
          - minor
          - patch
      # Same reasoning for the Tauri JS packages, which track the Rust crates
      # in src-tauri/Cargo.toml below -- see the note on that ecosystem entry
      # for the cross-ecosystem hazard this pairing creates.
      tauri:
        patterns:
          - "@tauri-apps/*"
        update-types:
          - minor
          - patch
      # React and ReactDOM must share a major version to run at all, and their
      # @types/* packages must match too. Dependabot's own automatic grouping
      # is not a substitute for this: it once proposed "react-dom" and
      # "@types/react-dom" together in one PR while leaving "react" and
      # "@types/react" out of that same group, which broke `npm ci` outright
      # (a peer-dependency mismatch, not a version-arithmetic mistake on
      # Dependabot's part -- its family-detection just doesn't reach this
      # wide by default). List all four explicitly instead of relying on that.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch
      # vite and @vitejs/plugin-react peer-constrain each other's major
      # version the same way eslint's packages do below -- confirmed in
      # practice: @vitejs/plugin-react@6 requires vite@^8, so bumping either
      # alone against the other's current major fails to install.
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
        update-types:
          - minor
          - patch
      # Everything else, bundled by risk level so routine upgrades arrive as a
      # couple of reviewable PRs rather than a dozen. Major versions are
      # deliberately excluded from these groups and so arrive individually,
      # which is what you want for a change that can break the build.
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "@tiptap/*"
          - "@tauri-apps/*"
          - "react"
          - "react-dom"
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"
          - "vite"
          - "@vitejs/plugin-react"
    # A major bump for either of these, if merely left ungrouped by the
    # restriction above, would arrive as one individual PR PER PACKAGE --
    # 15 of them for Tiptap. Suppress majors outright instead; do that
    # upgrade as a deliberate, manually-scoped piece of work when it's worth
    # doing, not as an avalanche of PRs to individually close.
    ignore:
      - dependency-name: "@tiptap/*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@tauri-apps/*"
        update-types:
          - "version-update:semver-major"
      # The ESLint/TypeScript toolchain is peer-interdependent the same way:
      # eslint, @eslint/js, eslint-plugin-react-hooks, typescript and
      # typescript-eslint all constrain each other's acceptable versions, and
      # each is a separate npm package so a major in any one falls through
      # the minor/patch-restricted groups above and arrives as its own PR.
      # Confirmed in practice: bumping eslint alone to 10.x, or @eslint/js
      # alone, or typescript alone, each broke `npm ci` outright with an
      # ERESOLVE peer-dependency conflict against the others -- and
      # typescript-eslint in particular can lag a new TypeScript major by a
      # long, unpredictable margin (at the time of writing, its newest
      # published version -- including its canary channel -- still caps
      # typescript at "<6.1.0"; there is no version that accepts TS7 yet).
      # Bump this group together, deliberately, the same shape as this one.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@eslint/js"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint-plugin-react-hooks"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript-eslint"
        update-types:
          - "version-update:semver-major"
      # Confirmed the same peer-coordination hazard for react/react-dom's
      # @types packages and for vite/@vitejs-plugin-react -- see the "react"
      # and "vite" groups above for the specifics of each.
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - "version-update:semver-major"
      # Tailwind v4 replaced the JS-config + @tailwind-directive architecture
      # with a CSS-first one (@import "tailwindcss" + @theme) -- this is a
      # real migration (new PostCSS plugin package, tailwind.config.js
      # rewritten as CSS, every utility class in the app re-checked), not a
      # version bump. `npm ci` succeeds for this one; the *build* fails
      # inside Tailwind's own PostCSS processing of the current config.
      # Deferred deliberately; do it as dedicated work when it's worth doing.
      - dependency-name: "tailwindcss"
        update-types:
          - "version-update:semver-major"

  # ---------------------------------------------------------------------------
  # Cargo — the Tauri desktop shell. Monthly: the Rust dependencies are few and
  # move slowly, and every PR here triggers a three-platform desktop build.
  #
  # Cross-ecosystem hazard: Tauri ships as a Rust crate family (here) plus a
  # matching JS package family (the "tauri" group in the npm block above), and
  # `tauri build` hard-fails if their major.minor versions disagree. Dependabot
  # has no way to express "bump these together" across two ecosystems -- each
  # side gets bumped in its own PR, independently, on its own schedule. Do NOT
  # merge a cargo tauri* bump and an npm @tauri-apps/* bump as two separate,
  # unrelated PRs. Merge them together, or reconcile with a fresh `cargo
  # update` / `npm install` on whichever side lagged, and confirm with
  # `npm run tauri:build` before pushing -- CI's "version mismatched Tauri
  # packages" error is that exact check catching a real problem, not a false
  # alarm to route around.
  # ---------------------------------------------------------------------------
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Same reasoning as the npm ignore rules above: a Tauri major would
      # otherwise fall through this group's minor/patch restriction and
      # arrive as one individual PR per crate (tauri, tauri-build, and every
      # tauri-plugin-*). Handle a major bump as deliberate, coordinated work
      # across both ecosystems instead.
      - dependency-name: "tauri*"
        update-types:
          - "version-update:semver-major"

  # ---------------------------------------------------------------------------
  # GitHub Actions themselves. This is what would have flagged the Node 20
  # runtime deprecation before the runners started warning about it.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
