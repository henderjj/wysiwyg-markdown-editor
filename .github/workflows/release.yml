name: Release

# Builds installers for all three platforms and attaches them to a GitHub
# Release. This runs ONLY when a version tag is pushed — nothing here fires on
# an ordinary commit.
#
#   git tag v1.5.2
#   git push origin v1.5.2
#
# The release is created as a DRAFT. Review the attached installers, write the
# release notes, then publish it manually from the GitHub Releases page. Draft
# is deliberate: an automatic publish would hand users unsigned binaries the
# moment a tag was pushed, with no chance to check them first.
#
# Note: the tag must match the version in tauri.conf.json, package.json and
# Cargo.toml. Nothing enforces that automatically.

# Deliberately tag-only. A workflow_dispatch trigger would set github.ref_name
# to the branch name, producing a draft release literally called "main". Re-run
# failed jobs from the Actions UI instead — that preserves the original ref.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the release and upload assets

jobs:
  release:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux (deb, rpm, AppImage)
            args: ''
          - os: macos-latest
            label: macOS (universal)
            args: '--target universal-apple-darwin'
          - os: windows-latest
            label: Windows (msi, nsis)
            args: ''

    steps:
      - uses: actions/checkout@v7

      # Fail fast if the tag disagrees with the manifests, rather than shipping
      # installers whose filenames and in-app version don't match the release.
      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=$TAG package.json=$PKG tauri.conf.json=$CONF"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$CONF" ]; then
            echo "::error::Tag v$TAG does not match package.json ($PKG) / tauri.conf.json ($CONF)"
            exit 1
          fi

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        # The Ayatana appindicator packages that Tauri wants declare an explicit
        # Conflicts: against the original libappindicator3 packages, and the
        # runner image ships the originals preinstalled. apt will not resolve
        # that on its own — it reports "held broken packages" and aborts — so
        # the old pair has to come off first. `|| true` keeps this working on
        # images where they were never installed.
        run: |
          sudo apt-get update
          sudo apt-get remove -y libappindicator3-1 libappindicator3-dev || true
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # A universal macOS binary needs both architectures available.
      - name: Add macOS targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Build and attach to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Tauri derives bundle filenames from productName + version + arch and offers
  # no template to control them, so the names are normalised here instead.
  # Renaming after upload (PATCH on the asset) avoids re-uploading anything.
  #
  # Runs once, after every platform has finished, so it sees the complete set.
  rename-assets:
    name: Normalise asset names
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Rename release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PRODUCT=$(node -p "require('./package.json').name")

          # A draft release is NOT reachable via /releases/tags/{tag} — that
          # endpoint 404s for drafts — so find it by listing releases instead.
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$TAG\")] | first | .id")

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "::error::No release found for tag $TAG"
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | "\(.id)\t\(.name)"' > assets.tsv

          while IFS=$'\t' read -r id name; do
            [ -z "${name:-}" ] && continue

            # The macOS .app is a directory, so tauri-action tars it purely to
            # have something uploadable. It is not an installer and there is no
            # updater configured to consume it (createUpdaterArtifacts is off),
            # so it is dead weight next to the .dmg and only makes the asset
            # list harder to read. Drop it rather than rename it.
            case "$name" in
              *.app.tar.gz)
                echo "deleting (redundant .app tarball, superseded by the .dmg): $name"
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$id" --silent
                continue
                ;;
            esac

            # Extension determines the OS.
            case "$name" in
              *.dmg)        ext="dmg";        os="macos"   ;;
              *.msi)        ext="msi";        os="windows" ;;
              *.exe)        ext="exe";        os="windows" ;;
              *.deb)        ext="deb";        os="linux"   ;;
              *.rpm)        ext="rpm";        os="linux"   ;;
              *.AppImage)   ext="AppImage";   os="linux"   ;;
              *) echo "skipping (unrecognised type): $name"; continue ;;
            esac

            # Keep each ecosystem's own architecture spelling: amd64 for Debian
            # and AppImage, x86_64 for RPM, x64 for Windows. Longest tokens are
            # tested first so a longer name cannot match a shorter one.
            arch=""
            for a in universal x86_64 aarch64 amd64 arm64 i686 x64; do
              case "$name" in *"$a"*) arch="$a"; break ;; esac
            done
            if [ -z "$arch" ]; then
              echo "skipping (no architecture in name): $name"
              continue
            fi

            # Distinguish the NSIS installer from the MSI.
            suffix=""
            case "$name" in *-setup.exe) suffix="-setup" ;; esac

            new="${PRODUCT}-${VERSION}-${os}-${arch}${suffix}.${ext}"

            if [ "$new" = "$name" ]; then
              echo "unchanged: $name"
              continue
            fi

            echo "$name  ->  $new"
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
              -f name="$new" --silent
          done < assets.tsv

          echo "--- final asset names ---"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[].name'
