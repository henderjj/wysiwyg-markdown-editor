name: Release

# Builds installers for all three platforms and attaches them to a GitHub
# Release. This runs ONLY when a version tag is pushed — nothing here fires on
# an ordinary commit.
#
#   git tag v1.5.2
#   git push origin v1.5.2
#
# The release is created as a DRAFT. Review the attached installers, write the
# release notes, then publish it manually from the GitHub Releases page. Draft
# is deliberate: an automatic publish would hand users unsigned binaries the
# moment a tag was pushed, with no chance to check them first.
#
# Do NOT create the release yourself in the GitHub UI — publish the draft this
# workflow produces. tauri-action is configured with releaseDraft: true, and its
# create-release step skips a release for the tag that is not a draft ("Found
# release with tag ... but it's NOT a draft!"), then creates a second release
# for the same tag rather than uploading into the one you made. Your release
# stays empty. That is how v1.8.1 came to be published with no binaries.
#
# To recover from that: turn the release back into a draft
# (gh release edit <tag> --draft), re-run the original tagged run from the
# Actions UI — which preserves github.ref_name, so tauri-action finds the draft
# and uploads into it — then publish the release again. The release keeps its
# id, URL and notes.
#
# Note: the tag must match the version in tauri.conf.json, package.json and
# Cargo.toml. Nothing enforces that automatically.

# Two ways in, and both end up with a real tag name in TAG_NAME below.
#
#   push: tags   — the normal route. `git push origin v1.9.0`.
#   workflow_call — used by version-bump.yml, which creates the tag itself and
#                   then calls this workflow directly. That call is NOT
#                   optional plumbing: a tag pushed by a workflow using the
#                   default GITHUB_TOKEN does not trigger another workflow, so
#                   the `push: tags` route above would simply never fire for a
#                   bot-created tag. Calling this workflow sidesteps that
#                   without needing a PAT.
#
# Still no workflow_dispatch: dispatching from the Actions UI would set
# github.ref_name to the branch name and produce a draft release literally
# called "main". Re-run failed jobs from the Actions UI instead — that preserves
# the original ref. Every step below reads `inputs.tag || github.ref_name` so
# the two entry points share one code path; `inputs.tag` is empty on a tag push.
on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: 'Version tag to build and release, e.g. v1.9.0. Must already exist.'
        required: true
        type: string

permissions:
  contents: write # required to create the release and upload assets

jobs:
  release:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux (deb, rpm, AppImage)
            args: ''
          - os: macos-latest
            label: macOS (universal)
            args: '--target universal-apple-darwin'
          - os: windows-latest
            label: Windows (msi, nsis)
            args: ''

    steps:
      # Explicit ref rather than the default. On a tag push the default would be
      # right anyway, but on a workflow_call the default is the *caller's* SHA —
      # for version-bump.yml that is the commit before the bump, so the build
      # would carry the old version.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # Fail fast if the tag disagrees with the manifests, rather than shipping
      # installers whose filenames and in-app version don't match the release.
      - name: Verify tag matches package version
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="${TAG_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=$TAG package.json=$PKG tauri.conf.json=$CONF"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$CONF" ]; then
            echo "::error::Tag v$TAG does not match package.json ($PKG) / tauri.conf.json ($CONF)"
            exit 1
          fi

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        # The Ayatana appindicator packages that Tauri wants declare an explicit
        # Conflicts: against the original libappindicator3 packages, and the
        # runner image ships the originals preinstalled. apt will not resolve
        # that on its own — it reports "held broken packages" and aborts — so
        # the old pair has to come off first. `|| true` keeps this working on
        # images where they were never installed.
        run: |
          sudo apt-get update
          sudo apt-get remove -y libappindicator3-1 libappindicator3-dev || true
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # A universal macOS binary needs both architectures available.
      - name: Add macOS targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Build and attach to release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Tauri derives bundle filenames from productName + version + arch and offers
  # no template to control them, so the names are normalised here instead.
  # Renaming after upload (PATCH on the asset) avoids re-uploading anything.
  #
  # An asset has both a `name` and a `label`, and the release *page* shows the
  # label whenever one is set, so both have to be dealt with — see the comment
  # on the PATCH below.
  #
  # Runs once, after every platform has finished, so it sees the complete set.
  rename-assets:
    name: Normalise asset names
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Rename release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PRODUCT=$(node -p "require('./package.json').name")

          # A draft release is NOT reachable via /releases/tags/{tag} — that
          # endpoint 404s for drafts — so find it by listing releases instead.
          # One "<id>\t<draft>" line per release carrying this tag. --paginate
          # runs the jq filter once per page, so the filter has to emit a line
          # per release; building an array would yield one array per page.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id)\t\(.draft)\"" \
            > releases.tsv

          # Prefer the draft. A tag can end up with two releases — if someone
          # created the release by hand, tauri-action leaves it alone and adds
          # its own draft alongside it (see the header comment) — and the assets
          # to rename are always on the draft that tauri-action uploaded into,
          # never on the published one.
          RELEASE_ID=$(awk -F'\t' '$2 == "true" { print $1; exit }' releases.tsv)
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(awk -F'\t' 'NR == 1 { print $1 }' releases.tsv)
          fi

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "::error::No release found for tag $TAG"
            exit 1
          fi

          if [ "$(wc -l < releases.tsv)" -gt 1 ]; then
            echo "::warning::Tag $TAG has more than one release; renaming assets on $RELEASE_ID. Check for a duplicate release created by hand."
          fi

          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | "\(.id)\t\(.name)\t\(.label // "")"' > assets.tsv

          while IFS=$'\t' read -r id name label; do
            [ -z "${name:-}" ] && continue
            label="${label:-}"

            # The macOS .app is a directory, so tauri-action tars it purely to
            # have something uploadable. It is not an installer and there is no
            # updater configured to consume it (createUpdaterArtifacts is off),
            # so it is dead weight next to the .dmg and only makes the asset
            # list harder to read. Drop it rather than rename it.
            case "$name" in
              *.app.tar.gz)
                echo "deleting (redundant .app tarball, superseded by the .dmg): $name"
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$id" --silent
                continue
                ;;
            esac

            # Extension determines the OS.
            case "$name" in
              *.dmg)        ext="dmg";        os="macos"   ;;
              *.msi)        ext="msi";        os="windows" ;;
              *.exe)        ext="exe";        os="windows" ;;
              *.deb)        ext="deb";        os="linux"   ;;
              *.rpm)        ext="rpm";        os="linux"   ;;
              *.AppImage)   ext="AppImage";   os="linux"   ;;
              *) echo "skipping (unrecognised type): $name"; continue ;;
            esac

            # Keep each ecosystem's own architecture spelling: amd64 for Debian
            # and AppImage, x86_64 for RPM, x64 for Windows. Longest tokens are
            # tested first so a longer name cannot match a shorter one.
            arch=""
            for a in universal x86_64 aarch64 amd64 arm64 i686 x64; do
              case "$name" in *"$a"*) arch="$a"; break ;; esac
            done
            if [ -z "$arch" ]; then
              echo "skipping (no architecture in name): $name"
              continue
            fi

            # Distinguish the NSIS installer from the MSI.
            suffix=""
            case "$name" in *-setup.exe) suffix="-setup" ;; esac

            new="${PRODUCT}-${VERSION}-${os}-${arch}${suffix}.${ext}"

            # The release page renders an asset's `label` whenever one is set and
            # falls back to `name` only when it is empty — and tauri-action
            # uploads every bundle with `label` set to the original filename.
            # Patching `name` alone therefore fixes the download URL and the
            # release *edit* view while the release page carries on displaying
            # the Tauri names, which is exactly what happened on v1.8.0 and
            # v1.8.1 (cleared by hand afterwards). Clear the label in the same
            # request. That is also why an already-correct name cannot simply be
            # skipped: its label may still need clearing.
            if [ "$new" = "$name" ] && [ -z "$label" ]; then
              echo "unchanged: $name"
              continue
            fi

            if [ "$new" = "$name" ]; then
              echo "clearing label on: $name"
            else
              echo "$name  ->  $new"
            fi

            # Sent as a JSON body rather than -f name=... because -f has no way
            # to express an empty string, and an omitted label is left as-is
            # rather than cleared. $new is built from the fixed tokens above, so
            # it needs no escaping.
            printf '{"name":"%s","label":""}' "$new" \
              | gh api --method PATCH \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
                  --input - --silent
          done < assets.tsv

          echo "--- final asset names ---"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | "\(.name)\tlabel=[\(.label // "")]"'
